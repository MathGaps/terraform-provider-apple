# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
version: 2

# The Terraform Registry requires the release artifacts to be named
# terraform-provider-apple_<version>_<os>_<arch>.zip. GoReleaser would otherwise
# infer the project name from the checkout directory, so pin it.
project_name: terraform-provider-apple

before:
  hooks:
    - go mod tidy
builds:
  # Only the provider binary is released. The Registry ingests a release by
  # matching every entry in SHA256SUMS against the expected artifact names, so
  # anything else built here would fail ingestion.
- main: .
  env:
    # goreleaser does not work with CGO, it could also complicate
    # usage by users in CI/CD systems like HCP Terraform where
    # they are unable to install libraries.
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
  ldflags:
    - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'
  goos:
    - freebsd
    - windows
    - linux
    - darwin
  goarch:
    - amd64
    - '386'
    - arm
    - arm64
  ignore:
    - goos: darwin
      goarch: '386'
  binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
- format: zip
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      # if you are using this in a GitHub action or some other automated pipeline, you 
      # need to pass the batch flag to indicate its not interactive.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}" # set this environment variable for your signing key
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # A draft until every asset is up: the release workflow publishes it in its last
  # step. The OpenTofu registry scans for new releases every few minutes, and a
  # release it sees before SHA256SUMS has uploaded is recorded as an error
  # ("checksums not found in release") and not retried for half an hour.
  draft: true
# No changelog block: `--release-notes` in the release workflow supplies the
# body from CHANGELOG.md, and GoReleaser loads that file during the changelog
# step. `disable: true` here skips the step -- and with it the file, silently
# publishing an empty release body. Omitting the block leaves the step enabled;
# it does not generate a commit list of its own when --release-notes is given.
